services:
  rabbit1:
    image: rabbitmq:3.13-management
    container_name: rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: "PEDIDOS360_SECRET_COOKIE"
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
    networks:
      - pedidos360-mq-net

  rabbit2:
    image: rabbitmq:3.13-management
    container_name: rabbit2
    hostname: rabbit2
    depends_on:
      - rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: "PEDIDOS360_SECRET_COOKIE"
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
    entrypoint: >
      bash -c "
      docker-entrypoint.sh rabbitmq-server -detached &&
      sleep 12 &&
      rabbitmqctl stop_app &&
      rabbitmqctl reset &&
      rabbitmqctl join_cluster rabbit@rabbit1 &&
      rabbitmqctl stop &&
      sleep 3 &&
      docker-entrypoint.sh rabbitmq-server
      "
    networks:
      - pedidos360-mq-net

volumes:
  rabbit1_data:
  rabbit2_data:

networks:
  pedidos360-mq-net:
    driver: bridge